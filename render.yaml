# Render blueprint — gives JobPilot a free live web link.
# Render reads this file when you connect the repo.
# You still add your secret keys in the Render dashboard (never in code).
services:
  - type: web
    name: jobpilot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python web/manage.py collectstatic --noinput"
    startCommand: "gunicorn jobpilot_web.wsgi:application --chdir web --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render makes a strong secret for you
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Add these SECRETS in the Render dashboard (Environment tab), copy from your .env:
      #   SUPABASE_URL, SUPABASE_SECRET_KEY, GEMINI_API_KEY, GEMINI_API_KEY_2,
      #   GROQ_API_KEY, GMAIL_EMAIL, GMAIL_APP_PASSWORD
